spring:
  application:
    name: gemma-portal
  main:
    web-application-type: servlet
  docker:
    compose:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/gemma_portal
    username: gemma
    password: gemma
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

cors:
  allowed-origins: http://localhost:3000

ollama:
  base-url: http://localhost:11434
  model: gemma3:1b

logging:
  level:
    com.gemmaportal: INFO